<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Assistant</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" id="hl-theme" />
    <link rel="stylesheet" href="/static/webapp.css" />
</head>
<body data-mode="{{ mode }}" data-answer-id="{{ answer_id or '' }}" data-bot-username="{{ bot_username }}">
<div class="app">
    <header class="app__header">
        <h1>AI Assistant</h1>
        <p id="status">Загружаем ответ…</p>
    </header>
    <main class="app__content">
        <article id="answer" class="markdown"></article>
        <section id="meta" class="meta"></section>
    </main>
    <footer class="app__footer">
        <button id="share-btn" class="btn">Поделиться</button>
        <button id="open-bot-btn" class="btn btn--primary">Открыть в боте</button>
        <button id="generate-image-btn" class="btn btn--secondary hidden">Сгенерировать изображение</button>
    </footer>
</div>
<script type="module" src="/static/webapp.js"></script>
</body>
</html>
