[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-ai-assistant"
version = "0.1.0"
description = "Telegram bot with streaming AI responses and WebApp viewer"
authors = [{name = "Senior Dev"}]
dependencies = [
    "aiogram==3.4.1",
    "fastapi==0.110.0",
    "uvicorn[standard]==0.29.0",
    "pydantic-settings==2.2.1",
    "SQLAlchemy==2.0.29",
    "aiosqlite==0.19.0",
    "httpx==0.27.0",
    "markdown-it-py[plugins]==3.0.0",
    "bleach==6.1.0",
    "python-multipart==0.0.9",
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "anyio==4.2.0",
    "fakeredis==2.22.0",
    "ruff==0.4.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "ANN", "ASYNC", "S", "B", "COM", "C4"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN201", "ANN001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

